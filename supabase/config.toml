# Supabase local config. Targets a recent Supabase CLI (>= 1.170 / 2.x).
# `supabase start` runs Postgres + Auth + Studio locally in Docker — no account
# needed. If your CLI version rejects any key here, run `supabase init` in this
# folder (it will NOT touch supabase/migrations/) and re-apply your differences.
project_id = "jobi"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing (magic links / signup confirmations land here).
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5678"
additional_redirect_urls = ["http://localhost:5678", "exp://127.0.0.1:19000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# For local dev, don't force email confirmation so you can log in immediately.
enable_confirmations = false

[analytics]
enabled = false
